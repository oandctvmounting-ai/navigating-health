<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigating Health — Podcast Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="editor.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      Navigating Health
      <small>Podcast Editor</small>
    </div>
    <button class="logout" onclick="logout()">Sign out</button>
  </header>

  <div class="wrap">
    <h1 style="font-size:2rem; margin-bottom:0.25rem;">Manage Episodes</h1>
    <p style="color:var(--muted); margin-top:0;">Add, edit, and remove podcast episodes. Changes go live on the site automatically.</p>

    <div id="status"></div>

    <!-- New episode form -->
    <div class="panel" id="form-panel">
      <div class="section-label" id="form-title">New Episode</div>
      <form id="episode-form">
        <input type="hidden" id="episode-id">

        <div class="field">
          <label for="title">Episode title *</label>
          <input type="text" id="title" placeholder="e.g. The Science of Letting Go" required>
        </div>

        <div class="field">
          <label for="caption">Caption / description *</label>
          <textarea id="caption" placeholder="A sentence or two describing this episode..." required></textarea>
        </div>

        <div class="field">
          <label for="video">Video link (YouTube or Vimeo) *</label>
          <input type="url" id="video" placeholder="https://www.youtube.com/watch?v=... OR https://vimeo.com/..." required>
          <div class="hint">Paste the full link. We'll embed and play it on the site automatically.</div>
        </div>

        <div class="field" style="display:flex; gap:0.6rem; align-items:center;">
          <button type="submit" class="btn btn-primary" id="save-btn">Save Episode</button>
          <button type="button" class="btn btn-ghost" id="cancel-btn" style="display:none;">Cancel</button>
        </div>
      </form>
    </div>

    <!-- Episode list -->
    <div class="panel">
      <div class="section-label">Your Episodes</div>
      <div id="episode-list" class="episode-list">
        <div class="empty">Loading episodes…</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="api.js"></script>
  <script>
    if (!isLoggedIn()) {
      window.location.replace("login.html");
    }

    const form = document.getElementById("episode-form");
    const listEl = document.getElementById("episode-list");
    const statusEl = document.getElementById("status");
    const saveBtn = document.getElementById("save-btn");
    const cancelBtn = document.getElementById("cancel-btn");
    const formTitle = document.getElementById("form-title");
    const idField = document.getElementById("episode-id");

    function setStatus(msg, kind) {
      statusEl.textContent = msg || "";
      statusEl.className = kind || "";
    }

    function resetForm() {
      form.reset();
      idField.value = "";
      formTitle.textContent = "New Episode";
      cancelBtn.style.display = "none";
      saveBtn.textContent = "Save Episode";
      setStatus("");
    }

    async function renderList() {
      listEl.innerHTML = '<div class="empty">Loading episodes…</div>';
      try {
        const episodes = await apiListEpisodes();
        if (!episodes.length) {
          listEl.innerHTML = '<div class="empty">No episodes yet. Add your first one above. 🎙️</div>';
          return;
        }
        listEl.innerHTML = "";
        episodes.forEach(function (ep) {
          const row = document.createElement("div");
          row.className = "episode-row";

          const thumb = document.createElement("img");
          thumb.className = "thumb";
          thumb.src = ep.thumbnail || "";
          thumb.alt = ep.title || "Episode";
          thumb.onerror = function () { this.style.opacity = "0.3"; };

          const info = document.createElement("div");
          info.className = "info";
          const h = document.createElement("h4");
          h.textContent = ep.title || "(no title)";
          const p = document.createElement("p");
          p.textContent = ep.caption || "";
          info.appendChild(h);
          info.appendChild(p);

          const actions = document.createElement("div");
          actions.className = "actions";

          const editBtn = document.createElement("button");
          editBtn.className = "btn btn-ghost";
          editBtn.textContent = "Edit";
          editBtn.onclick = function () { loadEpisode(ep); };

          const delBtn = document.createElement("button");
          delBtn.className = "btn btn-danger";
          delBtn.textContent = "Delete";
          delBtn.onclick = function () { removeEpisode(ep); };

          actions.appendChild(editBtn);
          actions.appendChild(delBtn);

          row.appendChild(thumb);
          row.appendChild(info);
          row.appendChild(actions);
          listEl.appendChild(row);
        });
      } catch (err) {
        console.error(err);
        listEl.innerHTML = '<div class="empty">⚠️ Could not load episodes. Check your config.js values.</div>';
      }
    }

    function loadEpisode(ep) {
      idField.value = ep.id;
      document.getElementById("title").value = ep.title || "";
      document.getElementById("caption").value = ep.caption || "";
      document.getElementById("video").value = ep.video || "";
      formTitle.textContent = "Edit Episode";
      saveBtn.textContent = "Update Episode";
      cancelBtn.style.display = "inline-block";
      setStatus("");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function removeEpisode(ep) {
      if (!confirm('Delete "' + (ep.title || "this episode") + '"?')) return;
      try {
        await apiDeleteEpisode(ep.id);
        setStatus("Episode deleted.", "ok");
        resetForm();
        await renderList();
      } catch (err) {
        console.error(err);
        setStatus("Delete failed. See console.", "err");
      }
    }

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      setStatus("");
      saveBtn.disabled = true;

      const episode = {
        title: document.getElementById("title").value.trim(),
        caption: document.getElementById("caption").value.trim(),
        video: document.getElementById("video").value.trim()
      };

      const embed = videoEmbed(episode.video);
      if (!embed) {
        setStatus("That doesn't look like a YouTube or Vimeo link. Please paste a full link.", "err");
        saveBtn.disabled = false;
        return;
      }

      const payload = {
        title: episode.title,
        caption: episode.caption,
        video: episode.video,
        embed_src: embed.src,
        thumbnail: autoThumbnail(embed)
      };

      try {
        const id = idField.value;
        if (id) {
          await apiUpdateEpisode(id, payload);
          setStatus("Episode updated ✓", "ok");
        } else {
          await apiCreateEpisode(payload);
          setStatus("Episode published ✓", "ok");
        }
        resetForm();
        await renderList();
      } catch (err) {
        console.error(err);
        setStatus("Save failed. Double-check your Supabase setup (see SETUP.md).", "err");
      } finally {
        saveBtn.disabled = false;
      }
    });

    cancelBtn.addEventListener("click", resetForm);

    renderList();
  </script>
</body>
</html>
